# =============================================================================
# Environment for differential analysis and figure building
#
# Covers:
#   01_select_regions_and_differential_anaysis.sh          regions, counting, DESeq2, tracks
#   02_generate_differential_analysis_figures.sh           violin / volcano / MA figures
#   03_differential_analysis_feature_correlations.sh       pearson correlation of genomic feature with log2FC
#   05_heatmap_violinplot_quantifications.sh               heatmaps, violins, metagenes
#   06_quantification_CUTnTag_protocol_conditions.sh       single-replicate edgeR comparisons
#
#
# =============================================================================

name: chrom_diff_figures

channels:
  - conda-forge
  - bioconda

dependencies:

  # --- interpreters -----------------------------------------------------------
  - python=3.11
  - r-base=4.3

  # --- genomics command-line tools --------------------------------------------
  - deeptools=3.5.6          # multiBamSummary, multiBigwigSummary, computeMatrix,
                             # plotHeatmap, bigwigCompare, bamCoverage
  - bedtools>=2.31           # region set construction, intersects, makewindows
  - ucsc-bedtobigbed # bedToBigBed, for the coloured UCSC .bb tracks
  - samtools

  # --- python libraries -------------------------------------------------------
  # pyBigWig is pulled in by deeptools, but the control/validation script calls
  # it directly (merge_proseq checks a bigWig's minVal to decide whether the
  # minus strand is stored as negative values), so it is requested explicitly.
  - pybigwig
  - numpy
  - scipy
  - matplotlib-base           # deepTools plotting backend

  # --- R: differential analysis ----------------------------------------------
  - bioconductor-deseq2       # 01_differential_analysis.sh
  - bioconductor-edger        # single-replicate edgeR script
  - r-locfit                  # DESeq2 fitType="local"; usually pulled in anyway

  # --- R: data handling -------------------------------------------------------
  - r-readr
  - r-dplyr
  - r-tidyr
  - r-tibble
  - r-data.table              # fast matrix reads in the heatmap/metagene script
  - r-jsonlite                # parses the computeMatrix .gz header

  # --- R: plotting ------------------------------------------------------------
  - r-ggplot2
  - r-scales
  - r-patchwork               # figure composition
  - r-ggrastr                 # rasterised point layers in volcano / MA panels
  - r-ggtext                  # element_markdown() strip labels, geom_richtext()
  - r-ggh4x                   # facet_nested_wrap() in the supplementary figure
  - r-cairo                   # raster device ggrastr uses when writing PDFs

  # --- shell utilities --------------------------------------------------------
  - gawk
  - coreutils
  - gzip                      # zcat, used by data.table::fread on matrix .gz