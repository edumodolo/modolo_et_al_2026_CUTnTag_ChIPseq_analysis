# =============================================================================
# Environment for differential analysis and figure building
#
# Covers:
#   01_differential_analysis.sh          regions, counting, DESeq2, tracks
#   02_make_figures.sh                   violin / volcano / MA figures
#   control_validation_figures.sh        heatmaps, violins, metagenes
#   ground_truth_single_rep_edgeR.sh     single-replicate edgeR comparisons
#
# Create and activate:
#   conda config --set channel_priority strict     # once, recommended
#   conda env create -f environment_diff_figures.yml
#   conda activate chrom_diff_figures
#
# mamba is much faster on an environment this size:
#   mamba env create -f environment_diff_figures.yml
#
# HOMER is NOT installed here. The single-replicate edgeR script calls
# annotatePeaks.pl, which expects a HOMER installation configured with the hg38
# genome; install it separately by following the instructions at
# http://homer.ucsd.edu/homer/introduction/install.html and make sure its bin/
# directory is on your PATH. Nothing else in these scripts needs HOMER --
# 01_differential_analysis.sh counts straight from BAMs with deepTools.
# =============================================================================

name: chrom_diff_figures

channels:
  - conda-forge
  - bioconda

dependencies:

  # --- interpreters -----------------------------------------------------------
  # deepTools 3.5.6 supports this Python; R 4.3 matches the Bioconductor 3.18
  # builds of DESeq2 and edgeR that conda resolves to.
  - python=3.11
  - r-base=4.3

  # --- genomics command-line tools --------------------------------------------
  # deepTools is PINNED. The paired-end counting flags in
  # 01_differential_analysis.sh (--extendReads --samFlagInclude 64) were chosen
  # from a direct measurement on 3.5.6, in which that version counted both mates
  # of a pair even with --extendReads. The behaviour is version-dependent, so if
  # you change this pin, re-verify that a fragment is counted once before
  # trusting the counts.
  - deeptools=3.5.6          # multiBamSummary, multiBigwigSummary, computeMatrix,
                             # plotHeatmap, bigwigCompare, bamCoverage
  - bedtools>=2.31           # region set construction, intersects, makewindows
  - ucsc-bedtobigbed # bedToBigBed, for the coloured UCSC .bb tracks
  - samtools

  # --- python libraries -------------------------------------------------------
  # pyBigWig is pulled in by deeptools, but the control/validation script calls
  # it directly (merge_proseq checks a bigWig's minVal to decide whether the
  # minus strand is stored as negative values), so it is requested explicitly.
  - pybigwig
  - numpy
  - scipy
  - matplotlib-base           # deepTools plotting backend

  # --- R: differential analysis ----------------------------------------------
  - bioconductor-deseq2       # 01_differential_analysis.sh
  - bioconductor-edger        # single-replicate edgeR script
  - r-locfit                  # DESeq2 fitType="local"; usually pulled in anyway

  # --- R: data handling -------------------------------------------------------
  - r-readr
  - r-dplyr
  - r-tidyr
  - r-tibble
  - r-data.table              # fast matrix reads in the heatmap/metagene script
  - r-jsonlite                # parses the computeMatrix .gz header

  # --- R: plotting ------------------------------------------------------------
  - r-ggplot2
  - r-scales
  - r-patchwork               # figure composition
  - r-ggrastr                 # rasterised point layers in volcano / MA panels
  - r-ggtext                  # element_markdown() strip labels, geom_richtext()
  - r-ggh4x                   # facet_nested_wrap() in the supplementary figure
  - r-cairo                   # raster device ggrastr uses when writing PDFs

  # --- shell utilities --------------------------------------------------------
  # The scripts lean on awk for numeric work (log(), printf formatting). gawk is
  # requested so behaviour does not depend on whether the host provides mawk,
  # busybox awk, or gawk as /usr/bin/awk.
  - gawk
  - coreutils
  - gzip                      # zcat, used by data.table::fread on matrix .gz